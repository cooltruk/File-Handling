<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencarian Kata Kunci</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Cari Kata Kunci dalam File</h2>
    <form method="post" action="proses.php" enctype="multipart/form-data" class="row g-3">
        <div class="col-md-6">
            <label for="keyword" class="form-label">Kata Kunci</label>
            <input type="text" class="form-control" id="keyword" name="keyword" required>
        </div>
        <div class="col-md-6">
            <label for="filename" class="form-label">Unggah File</label>
            <input type="file" class="form-control" id="filename" name="filename" accept=".txt,.html,.php" required>
        </div>
        <div class="col-md-6">
            <label for="operation" class="form-label">Operasi</label>
            <select class="form-select" id="operation" name="operation">
                <option value="show">Show</option>
                <option value="redact">Redact</option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="output_type" class="form-label">Tipe Keluaran</label>
            <select class="form-select" id="output_type" name="output_type">
                <option value="N">New File</option>
                <option value="O">Overwrite</option>
            </select>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Proses</button>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
